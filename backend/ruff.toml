line-length = 120
target-version = "py311"
extend-exclude = ["staticfiles", "frontend_dist"]

[lint]
# pyflakes, pycodestyle, import order, bugbear, pyupgrade, simplify
select = ["F", "E", "W", "I", "B", "UP", "SIM"]
ignore = [
    "E731",  # small lambdas are fine in tests
    "B905",  # zip(points, points[1:]) is deliberate; strict=True would turn data mismatches into 500s
]
