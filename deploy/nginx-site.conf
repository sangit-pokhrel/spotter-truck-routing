# HTTPS for the app through the nginx that already owns ports 80/443 on the server.
#
#   sudo cp nginx-site.conf /etc/nginx/sites-available/truck-routing
#   sudo sed -i 's/truck.example.com/YOUR.DOMAIN/' /etc/nginx/sites-available/truck-routing
#   sudo ln -s /etc/nginx/sites-available/truck-routing /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d YOUR.DOMAIN      # adds the 443 block and the HTTP->HTTPS redirect
#
# Then in deploy/.env: APP_BIND=127.0.0.1 (only nginx can reach the app) and TRUSTED_PROXIES=1.
server {
    listen 80;
    listen [::]:80;
    server_name truck.example.com;

    location / {
        proxy_pass http://127.0.0.1:8563;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
        # the browser can post forecasts back to the API (a few MB at most); the default is 1 MB
        client_max_body_size 10m;
    }
}
