# Production stack for a single VPS (Docker Engine + Compose v2).
#
#   cp .env.example .env   # fill in DOMAIN, DJANGO_SECRET_KEY (see comments there)
#   ./deploy.sh latest     # or let CI run it on every push to main
#
# The app is published on host port APP_PORT (default 8563) and leaves 80/443 to whatever else
# runs on the server. For HTTPS, point your existing reverse proxy at it (deploy/nginx-site.conf),
# or, on a server where 80/443 are free, enable the bundled Caddy with COMPOSE_PROFILES=https.
#
# Optional self-hosted Valhalla (posted speed limits without public rate limits):
#   add "valhalla" to COMPOSE_PROFILES and set VALHALLA_URL=http://valhalla:8002 in .env
name: truck-routing

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  web:
    image: ${IMAGE:-ghcr.io/sangit-pokhrel/spotter-truck-routing}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      # "web": the bundled Caddy health-checks the container by its service name
      DJANGO_ALLOWED_HOSTS: ${DOMAIN:?set DOMAIN in .env},localhost,127.0.0.1,web
      REDIS_URL: redis://redis:6379/0
      # Reverse proxies in front (1 = nginx/Caddy) so rate limits see real client IPs; 0 when
      # clients connect to APP_PORT directly.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-1}
      WEATHER_SOURCE: ${WEATHER_SOURCE:-auto}
    ports:
      # APP_BIND=127.0.0.1 keeps it reachable only through the proxy on this server.
      - "${APP_BIND:-0.0.0.0}:${APP_PORT:-8563}:8000"
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    logging: *logging

  # Bundled HTTPS: only for servers where ports 80 and 443 are free (Let's Encrypt needs them).
  caddy:
    profiles: ["https"]
    image: caddy:2.11.7-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data # certificates: keep across restarts (Let's Encrypt rate limits)
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy
    logging: *logging

  redis:
    image: redis:8.10.0-alpine
    restart: unless-stopped
    # Append-only file so the learned speed-limit cache survives restarts; LRU keeps it bounded.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "384mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    logging: *logging

  # Self-hosted Valhalla: builds its routing graph from an OpenStreetMap extract on first start
  # (minutes for a state, hours for the whole US), then serves speed limits with no rate limit.
  # Needs roughly 2 GB RAM for a single state, 8+ GB for a large region; see README.
  valhalla:
    profiles: ["valhalla"]
    image: ghcr.io/valhalla/valhalla-scripted:3.9.1
    restart: unless-stopped
    environment:
      tile_urls: ${VALHALLA_PBF_URLS:-https://download.geofabrik.de/north-america/us/colorado-latest.osm.pbf}
      use_tiles_ignore_pbf: "True"
      build_admins: "True"
      build_time_zones: "True"
      build_elevation: "False"
      server_threads: ${VALHALLA_THREADS:-2}
    volumes:
      - valhalla-data:/custom_files
    expose:
      - "8002"
    logging: *logging

volumes:
  caddy-data:
  caddy-config:
  redis-data:
  valhalla-data:
