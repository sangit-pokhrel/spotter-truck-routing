# Render blueprint: New > Blueprint, then pick this repo.
services:
  - type: web
    name: spotter-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      # Render's proxy sits in front: count real clients for rate limiting
      - key: TRUSTED_PROXIES
        value: "1"
      - key: WEB_CONCURRENCY
        value: "2"
      # Render's shared IPs get throttled by Open-Meteo, so browsers fetch the forecasts
      - key: WEATHER_SOURCE
        value: client
