# One-click deploy on Render: New → Blueprint → point at this repo.
services:
  - type: web
    name: spotter-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: WEB_CONCURRENCY
        value: "2"
      # Open-Meteo rate-limits Render's shared egress IPs; let browsers fetch forecasts
      # (risk logic still runs server-side). See backend/trips/services/weather.py.
      - key: WEATHER_SOURCE
        value: client
