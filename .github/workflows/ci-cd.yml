# CI on every push and pull request; CD to the VPS on every push to main.
#
#   backend + frontend  ->  image (build, smoke-test, push to GHCR)  ->  deploy (SSH, deploy.sh, verify)
#
# Deploy is opt-in: set repository variable DEPLOY_ENABLED=true plus the secrets/variables
# listed in the README ("Deploy to your own VPS").
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never a running deploy on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python manage.py check --deploy --fail-level WARNING
        env:
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-only-secret-key-that-is-long-enough-for-django-checks-0123456789
      - run: pytest -q

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-fund --no-audit
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  image:
    name: Build, smoke-test, push image
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.vars.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: vars
        # Registry names must be lowercase; the owner name may not be.
        run: |
          echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.vars.outputs.image }}
          tags: |
            type=raw,value=${{ steps.vars.outputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}

      # Build once and load it locally so the exact image that ships is the one we test.
      - uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.vars.outputs.tag }}
            REVISION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the image
        run: |
          docker run -d --name smoke -p 8000:8000 \
            -e DJANGO_SECRET_KEY=ci-smoke -e DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1 \
            "${{ steps.vars.outputs.image }}:${{ steps.vars.outputs.tag }}"
          for i in $(seq 1 30); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' smoke)" = healthy ] && break
            sleep 2
          done
          docker inspect -f 'health: {{.State.Health.Status}}' smoke
          curl -fsS http://localhost:8000/api/health/ | tee /dev/stderr | grep -q '"${{ steps.vars.outputs.tag }}"'
          curl -fsS -o /dev/null http://localhost:8000/                       # SPA shell
          curl -fsS -D - -o /dev/null http://localhost:8000/manifest.webmanifest             | grep -qi 'content-type: application/manifest+json'                # installable PWA
          curl -fsS -o /dev/null http://localhost:8000/sw.js                  # service worker
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{}' http://localhost:8000/api/plan/)
          [ "$code" = 400 ]   # validation works without calling any external service

      - name: Container logs on failure
        if: failure()
        run: docker logs smoke || true

      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker push --all-tags "${{ steps.vars.outputs.image }}"

  deploy:
    name: Deploy to VPS
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    environment:
      name: production
      url: ${{ vars.PUBLIC_URL }}
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      # The stack definition is versioned with the code: ship it with every release.
      - name: Copy stack files
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          source: deploy/compose.yaml,deploy/Caddyfile,deploy/deploy.sh,deploy/.env.example,deploy/nginx-site.conf
          target: ${{ vars.DEPLOY_PATH }}
          strip_components: 1

      - name: Release
        uses: appleboy/ssh-action@v1.2.0
        env:
          TAG: ${{ needs.image.outputs.tag }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: TAG,GHCR_USER,GHCR_TOKEN,DEPLOY_PATH
          script: |
            set -euo pipefail
            cd "$DEPLOY_PATH"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash ./deploy.sh "$TAG"
            docker logout ghcr.io

      # PUBLIC_URL: how users reach the app, e.g. https://truck.example.com or http://SERVER_IP:8563
      - name: Verify the public site serves this release
        run: |
          curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "${{ vars.PUBLIC_URL }}/api/health/" \
            | tee /dev/stderr | grep -q '"${{ needs.image.outputs.tag }}"'
